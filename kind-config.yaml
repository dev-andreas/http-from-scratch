kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: testing-cluster
nodes:
  - role: control-plane
    kubeadmConfigPatches:
      - |
        kind: InitConfiguration
        nodeRegistration:
          kubeadmNodeAnnotations:
            ingress-ready: "true"
    extraPortMappings:
      - containerPort: 80
        hostPort: 80