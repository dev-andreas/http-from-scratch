apiVersion: apps/v1
kind: Deployment
metadata:
  name: go-server-deployment
  labels:
    app: go-server
spec:
  replicas: 1
  selector:
    matchLabels:
      app: go-server
  template:
    metadata:
      labels:
        app: go-server
    spec:
      containers:
        - name: go-server
          image: go-server:local
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: OTEL_LOGS_ENDPOINT
              value: http://victorialogs.monitoring.svc.cluster.local:9428
            - name: OTEL_TRACES_ENDPOINT
              value: http://victoriatraces.monitoring.svc.cluster.local:10428
