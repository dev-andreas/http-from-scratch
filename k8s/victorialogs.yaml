apiVersion: apps/v1
kind: Deployment
metadata:
  name: victorialogs
  namespace: monitoring
spec:
  replicas: 1
  selector:
    matchLabels:
      app: victorialogs
  template:
    metadata:
      labels:
        app: victorialogs
    spec:
      containers:
        - name: victorialogs
          image: victoriametrics/victoria-logs:latest
          args: ["-storageDataPath=/vlogs", "-retentionPeriod=7d"]
          ports:
            - containerPort: 9428
---
apiVersion: v1
kind: Service
metadata:
  name: victorialogs
  namespace: monitoring
spec:
  selector:
    app: victorialogs
  ports:
    - port: 9428
      targetPort: 9428